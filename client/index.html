<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiTrack | Join the design studio</title>
    <script>
      try {
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-white dark:bg-[#0F172A] text-[#111827] dark:text-[#F1F5F9] transition-colors duration-300">
    <div id="root">
      <div class="h-screen flex flex-col items-center justify-center font-sans gap-4 p-6 text-center">
        <div class="animate-pulse text-gray-400 text-sm tracking-widest uppercase">Loading ArchiTrack Studio...</div>
        <a href="/auth/login" style="font-size: 13px; color: #38bdf8; text-decoration: underline; margin-top: 8px;">Click here to Sign In directly &rarr;</a>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
