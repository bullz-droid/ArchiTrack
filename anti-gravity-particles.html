<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anti-Gravity Particle Burst</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a13;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      padding: 0 24px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
      pointer-events: none;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .overlay strong {
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="overlay">Click anywhere to launch an anti-gravity particle burst.</div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const particles = [];
    const ambient = [];
    const palette = ['#2fffd3', '#f20f7a', '#a8ff22', '#f8f8ff', '#ff9f3c'];
    let width = window.innerWidth;
    let height = window.innerHeight;
    let ratio = window.devicePixelRatio || 1;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      ratio = window.devicePixelRatio || 1;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    };

    const lerp = (a, b, t) => a + (b - a) * t;

    const createAmbient = () => {
      ambient.length = 0;
      for (let i = 0; i < 90; i += 1) {
        ambient.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: 0.5 + Math.random() * 1.5,
          alpha: 0.05 + Math.random() * 0.16,
          drift: (Math.random() - 0.5) * 0.15,
          phase: Math.random() * Math.PI * 2,
        });
      }
    };

    const spawnBurst = (x, y) => {
      const count = 70 + Math.floor(Math.random() * 35);
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 5.5;
        const color = palette[Math.floor(Math.random() * palette.length)];

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 3 + Math.random() * 4,
          baseRadius: 3 + Math.random() * 4,
          alpha: 1,
          life: 0,
          duration: 900 + Math.random() * 900,
          color,
          scale: 1,
          easing: (t) => 1 - Math.pow(1 - t, 3),
        });
      }
    };

    const drawBackground = () => {
      const gradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width * 0.9);
      gradient.addColorStop(0, '#08101c');
      gradient.addColorStop(1, '#02050d');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ambient.forEach((item) => {
        item.x += item.drift;
        item.y += Math.cos(item.phase + performance.now() * 0.001) * 0.04;
        item.phase += 0.008;

        if (item.x < -20) item.x = width + 20;
        if (item.x > width + 20) item.x = -20;
        if (item.y < -20) item.y = height + 20;
        if (item.y > height + 20) item.y = -20;

        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${item.alpha})`;
        ctx.fill();
      });
    };

    const renderParticles = () => {
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        const progress = Math.min(p.life / p.duration, 1);
        const ease = p.easing(progress);

        p.vx *= 0.96;
        p.vy *= 0.96;
        p.x += p.vx;
        p.y += p.vy - 0.08 * ease;
        p.scale = lerp(1, 0.08, ease);
        p.alpha = Math.max(0, 1 - ease * 1.15);
        p.radius = Math.max(0.6, lerp(p.baseRadius, 0.2, ease));
        p.life += 16;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 20;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * p.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.life >= p.duration || p.alpha < 0.02) {
          particles.splice(i, 1);
        }
      }
    };

    const animate = () => {
      drawBackground();
      renderParticles();
      requestAnimationFrame(animate);
    };

    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      spawnBurst(x, y);
    });

    window.addEventListener('resize', () => {
      resize();
      createAmbient();
    });

    resize();
    createAmbient();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
